<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Search Console Verification Meta Tag -->
    <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE">
    <meta name="description" content="CineCollab - Connect with talented Malayalam Script Writers, Directors, Editors, Actors, and Cinematographers for your next film project.">
    <title>CineCollab - Malayalam Cinema Network</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: #ffffff;
            width: 100%;
            padding: 22px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background-color: #e7f1ff;
            color: var(--primary-color);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2.2rem;
            transition: transform 0.3s ease;
        }

        h1:hover {
            transform: scale(1.03);
        }

        p.tagline {
            color: #666;
            margin: 6px 0 0 0;
            font-size: 1rem;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
            margin-bottom: 30px;
        }

        /* 6 സിനിമാറ്റിക് ഫോട്ടോകൾക്കുള്ള ഗ്രിഡ് ഗാലറി & Hover Effect */
        .banner-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .banner-gallery img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.12);
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }

        .banner-gallery img:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.25);
        }

        h2 {
            font-size: 1.35rem;
            color: #222;
            margin-top: 0;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        /* Submit Button Hover Effect */
        button.submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 13px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(13, 110, 253, 0.2);
        }

        button.submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(13, 110, 253, 0.35);
        }

        button.submit-btn:active {
            transform: translateY(0);
        }

        /* Filter Buttons & Hover Effects */
        .filter-section {
            margin-bottom: 22px;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .filter-btn {
            background-color: #e9ecef;
            color: #495057;
            border: none;
            padding: 9px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background-color: #d0d7de;
            color: #111;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        /* Profile Card & Hover Effects */
        .profile-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }

        .profile-card h3 {
            margin: 0 0 5px 0;
            color: var(--primary-color);
            font-size: 1.15rem;
        }

        .profile-card .role {
            font-size: 0.8rem;
            color: #ffffff;
            background-color: #6c757d;
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .profile-card p {
            margin: 10px 0 0 0;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .contact-info {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #0d6efd;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="badge">🎬 Malayalam Cinema Network</div>
        <h1>🎬 CineCollab</h1>
        <p class="tagline">Connect with Writers, Directors, Actors & Technicians</p>
    </header>

    <div class="container">
        <h2>Join the Network</h2>
        
        <!-- 6 സിനിമാറ്റിക് ഫോട്ടോകൾ -->
        <div class="banner-gallery">
            <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80" alt="Clapperboard">
            <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80" alt="Cinema Hall">
            <img src="https://images.unsplash.com/photo-1579632652768-6cb9dcf85912?auto=format&fit=crop&w=500&q=80" alt="Cinema Camera">
            <img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=500&q=80" alt="Script Writing">
            <img src="https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=500&q=80" alt="Video Editing">
            <img src="https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?auto=format&fit=crop&w=500&q=80" alt="Film Production">
        </div>

        <form id="profileForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="role">Select Role</label>
                <select id="role" required>
                    <option value="">-- Choose your role --</option>
                    <option value="Writer">Writer</option>
                    <option value="Director">Director</option>
                    <option value="Actor">Actor</option>
                    <option value="Technician">Technician</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bio">Short Bio / Description</label>
                <textarea id="bio" rows="3" required placeholder="Tell us about your work..."></textarea>
            </div>

            <div class="form-group">
                <label for="email">Email ID / Contact Info</label>
                <input type="text" id="email" required placeholder="Email or Phone / Instagram ID">
            </div>

            <button type="submit" class="submit-btn">Publish Profile</button>
        </form>
    </div>

    <div class="container">
        <h2>Explore Talents</h2>
        
        <div class="filter-section">
            <button class="filter-btn active" onclick="filterProfiles('All')">All</button>
            <button class="filter-btn" onclick="filterProfiles('Writer')">Writers</button>
            <button class="filter-btn" onclick="filterProfiles('Director')">Directors</button>
            <button class="filter-btn" onclick="filterProfiles('Actor')">Actors</button>
            <button class="filter-btn" onclick="filterProfiles('Technician')">Technicians</button>
        </div>

        <div id="profilesList">
            <p style="text-align: center; color: #666;">Loading profiles...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // നിങ്ങളുടെ ഒറിജിനൽ ഫയർബേസ് ലിങ്ക് ഇവിടെ ചേർത്തിട്ടുണ്ട്
        const firebaseConfig = {
            databaseURL: "https://cinecollab-b8781-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const profileForm = document.getElementById("profileForm");
        const profilesList = document.getElementById("profilesList");

        let allProfiles = [];
        let currentFilter = "All";
        let activeFolder = "profiles";

        profileForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const role = document.getElementById("role").value;
            const bio = document.getElementById("bio").value;
            const email = document.getElementById("email").value;

            const targetRef = ref(db, activeFolder);
            push(targetRef, { name, role, bio, email })
                .then(() => {
                    alert("Profile published successfully!");
                    profileForm.reset();
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        });

        // പഴയ പ്രൊഫൈലുകൾ ഏതു ഫോൾഡറിലാണെങ്കിലും കണ്ടെത്തി ലോഡ് ചെയ്യുന്നു
        const rootRef = ref(db, '/');
        onValue(rootRef, (snapshot) => {
            const rootData = snapshot.val();
            allProfiles = [];

            if (rootData) {
                for (let key in rootData) {
                    const folderData = rootData[key];
                    if (folderData && typeof folderData === 'object') {
                        // നേരിട്ട് പ്രൊഫൈൽ ആണോ അതോ ഫോൾഡർ ആണോ എന്ന് പരിശോധിക്കുന്നു
                        if (folderData.name && folderData.role) {
                            allProfiles.push({ id: key, ...folderData });
                        } else {
                            activeFolder = key; // പഴയ ഫോൾഡർ പേര് തുടരുന്നു
                            for (let id in folderData) {
                                if (folderData[id] && typeof folderData[id] === 'object') {
                                    allProfiles.push({ id, ...folderData[id] });
                                }
                            }
                        }
                    }
                }
            }
            renderProfiles();
        });

        window.filterProfiles = function(role) {
            currentFilter = role;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.textContent.toLowerCase().includes(role.toLowerCase()) || (role === 'All' && btn.textContent === 'All')) {
                    btn.classList.add('active');
                }
            });
            renderProfiles();
        }

        function renderProfiles() {
            profilesList.innerHTML = "";
            let filtered = [...allProfiles];
            if (currentFilter !== "All") {
                filtered = filtered.filter(p => p.role && p.role.toLowerCase().includes(currentFilter.toLowerCase()));
            }

            if (filtered.length === 0) {
                profilesList.innerHTML = '<p style="text-align: center; color: #666;">No profiles found.</p>';
                return;
            }

            filtered.reverse().forEach(profile => {
                const name = profile.name || "Unknown";
                const role = profile.role || "Member";
                const bio = profile.bio || profile.description || profile.about || "";
                const contact = profile.email || profile.contact || profile.phone || "";

                const card = document.createElement("div");
                card.className = "profile-card";
                card.innerHTML = `
                    <h3>${name}</h3>
                    <div class="role">${role}</div>
                    <p>${bio}</p>
                    <div class="contact-info">📧 ${contact}</div>
                `;
                profilesList.appendChild(card);
            });
        }
    </script>
</body>
</html>

            
        }
